version: '3.1'

services:

  tracker:
    image: humanmade/accelerate-tracker:latest
    ports:
      - 3399:3000
    environment:
      ACCESS_KEY: admin
      SECRET_KEY: password
      CLICKHOUSE_HOST: clickhouse
      DO_CLICKHOUSE: true
      DO_PINPOINT: ''

  clickhouse:
    image: clickhouse/clickhouse-server:25.2
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - '9020:9000'
      - '8123:8123'
    volumes:
      - ch:/var/lib/clickhouse
      - ./.setup:/.setup
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1

  grafana:
    image: grafana/grafana-enterprise
    ports:
      - '3600:3000'
    volumes:
      - grafana:/var/lib/grafana
    environment:
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource

volumes:
  es:
  ch:
  grafana:
